name: Temporary APM APK Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build-host branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore staged APM source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch apm-temp-build-20261007 https://github.com/randyadr/Rom2App.git /tmp/apm-stage
          cat /tmp/apm-stage/apm-temp/part* > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -t /tmp/project.zip
          mkdir -p /tmp/apm-project
          unzip -q /tmp/project.zip -d /tmp/apm-project
          test -f /tmp/apm-project/app/build.gradle
          test -f /tmp/apm-project/app/src/main/AndroidManifest.xml

      - name: Show Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | head -200 || true

      - name: Build debug APK
        working-directory: /tmp/apm-project
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=/tmp/apm-project/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload APM APK
        uses: actions/upload-artifact@v4
        with:
          name: APM-Standalone-1.31-LogTools
          path: /tmp/apm-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
